[package]
name = "sgx-attest-cli"
edition.workspace = true
license.workspace = true
version.workspace = true

[[bin]]
name = "sgx-attest"
path = "src/main.rs"

[dependencies]
attestations      = { workspace = true, features = ["replay"] }
rvlinux           = { path = "../crates/rvlinux" }
compilation-rustc = { path = "../compilation/rustc", features = ["host"] }
ed25519-dalek = { workspace = true, features = ["std"] }
sha2          = { workspace = true, features = ["std"] }
serde         = { workspace = true, features = ["std"] }
serde_json    = { workspace = true }
hex           = { workspace = true, features = ["std"] }
clap          = { workspace = true }

# Host-side enclave loader (the same crates ftxsgx-runner uses internally).
# Only buildable on x86_64 Linux; on other platforms the CLI still compiles
# and offers the --native dry-run path.
[target.'cfg(all(target_os = "linux", target_arch = "x86_64"))'.dependencies]
enclave-runner     = "0.8"
enclave-runner-sgx = "0.1"
sgxs-loaders       = "0.5"
aesm-client        = { version = "0.6", features = ["sgxs"] }
libc               = "0.2"
