[package]
name = "attestations"
edition.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
ed25519-dalek = { workspace = true, features = ["std"] }
sha2          = { workspace = true, features = ["std"] }
hkdf          = { workspace = true, features = ["std"] }
serde         = { workspace = true, features = ["std"] }
serde_json    = { workspace = true }
hex           = { workspace = true, features = ["std"] }
getrandom     = "0.2"

# Enabled by the replay enclave + the CLI host: pure-Rust parsing so the
# enclave can independently re-derive a canonical AST from the source.
syn           = { workspace = true, optional = true }
quote         = { workspace = true, optional = true }
proc-macro2   = { workspace = true, optional = true }

[features]
default = []
replay = ["dep:syn", "dep:quote", "dep:proc-macro2"]

[target.'cfg(target_env = "sgx")'.dependencies]
sgx-isa = { workspace = true, features = ["sgxstd"] }
