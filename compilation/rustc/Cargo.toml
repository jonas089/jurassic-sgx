[package]
name = "compilation-rustc"
edition.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
rvlinux = { path = "../../crates/rvlinux" }
serde   = { workspace = true, features = ["alloc"] }

# Host-only: Cargo.toml discovery / workspace scanning (`workspace` module,
# including crates.io fetching in `registry`) and the `mkbundle` binary.
# Never compiled into the enclave (replay-rustc depends on this crate with
# default features, i.e. without "host").
toml       = { version = "0.8", optional = true }
sha2       = { workspace = true, optional = true, features = ["std"] }
hex        = { workspace = true, optional = true, features = ["std"] }
serde_json = { workspace = true, optional = true }
ureq       = { version = "3", optional = true }
semver     = { version = "1", optional = true }
flate2     = { version = "1", optional = true }
tar        = { version = "0.4", optional = true }
lzma-rs    = { version = "0.3", optional = true }

[features]
host = [
    "dep:toml", "dep:sha2", "dep:hex", "dep:serde_json",
    "dep:ureq", "dep:semver", "dep:flate2", "dep:tar", "dep:lzma-rs",
]

[[bin]]
name = "mkbundle"
path = "src/bin/mkbundle.rs"
required-features = ["host"]
